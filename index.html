<script>
const P=[["h", 1, "DARK SEVEN"], ["h", 2, "DARK CORRIDORS"], ["p", 0, "A quiet man. A quiet life. You are safe here."], ["p", 0, "REST EASY."], ["p", 0, "DARK SEVEN"], ["p", 0, "Volume One: DARK CORRIDORS"], ["p", 0, "The rising tide. Corruption."], ["p", 0, "A new chapter in the saga of power and betrayal."], ["p", 0, "Shadows deepen. The Seven extend their reach."], ["p", 0, "The price of survival is higher than ever."], ["p", 0, "Face the truth, or be consumed."], ["p", 0, "BEAR WITNESS."], ["p", 0, "A SHANE BRAZELTON PRESENTATION"], ["p", 0, "A FILM BY DR. SEEN"], ["p", 0, "STARRING SHANE BRAZELTON"], ["p", 0, "SCREENPLAY BY SHANE BRAZELTON"], ["p", 0, "ORIGINAL SCORE BY DR. SEEN"], ["p", 0, "EXECUTIVE PRODUCER SHANE BRAZELTON"], ["p", 0, "PRODUCED BY BRAZELTON & DR. SEEN"], ["p", 0, "DIRECTED BY DR. SEEN"], ["p", 0, "DARK SEVEN"], ["p", 0, "R — RESTRICTED · Strong violence and language.", "R,  RESTRICTED · Strong violence and language."], ["h", 2, "THE FLOOR"], ["p", 0, "Rocket Valley. Prom Night."], ["p", 0, "The floor came up fast."], ["p", 0, "Not the way floors come up in movies. No slow-motion drift. No swell in the soundtrack. No amber-filtered moment of tragedy to give the scene its shape. Just the sudden strike of hot asphalt, the hollow sound of impact, and the immediate heat of blood. And the raw, animal question of whether the leaking would ever stop."], ["p", 0, "The box cutter made its line."], ["p", 0, "One clean line, started at the top of the spine and unzipped down."], ["p", 0, "The line never closed clean. It stayed raised, white against the rest of him, a permanent coordinate. Everything after hung off that line, whether he admitted it or not."], ["p", 0, "The body registered the violence before the mind could locate the geometry of the room, the people standing in it, or the sequence that had brought everything down this fast. The mind was still parsing. The body didn't wait. It was already flat against the asphalt."], ["p", 0, "Rocket Valley. Prom Night. Young men who had not yet learned that the world does not care how young you are when it decides to cut you open."], ["p", 0, "The blood was not dramatic. That is the truth nobody writes down. It was just there, pooling on the ground, spreading in the quiet, patient way fluid travels when gravity takes over the work. He looked at it the way a man looks at something he has no internal category for yet."], ["p", 0, "He had no category for this."], ["p", 0, "The scar it left never closed clean. That is not metaphor. That is the physical history of the man who carries this story — a line of raised tissue running down his spine, a place the skin remembers even when the mind is busy with other things. The cross that covers it comes later. That story is not this chapter. This chapter is only the floor, and the blood, and the boy on his back in the dark, learning for the first time what kind of world he had been born into.", "The scar it left never closed clean. That is not metaphor. That is the physical history of the man who carries this story,  a line of raised tissue running down his spine, a place the skin remembers even when the mind is busy with other things. The cross that covers it comes later. That story is not this chapter. This chapter is only the floor, and the blood, and the boy on his back in the dark, learning for the first time what kind of world he had been born into."], ["p", 0, "Prom Night is not a date in this book. It is a coordinate. Every corridor that follows is tethered to this single point. The cross will cover it, later. It will not erase what's underneath. The mark stays visible until the light finally detonates and swallows it whole — and that is a long way from here.", "Prom Night is not a date in this book. It is a coordinate. Every corridor that follows is tethered to this single point. The cross will cover it, later. It will not erase what's underneath. The mark stays visible until the light finally detonates and swallows it whole,  and that is a long way from here."], ["p", 0, "Right now it is only Prom Night."], ["p", 0, "The asphalt is hot."], ["p", 0, "The blood makes it cold."], ["p", 0, "The boy is on his back in the dark."], ["p", 0, "•  •  •", ""], ["p", 0, "The afternoon had no idea what it was about to become."], ["p", 0, "Warm day. Windows down. A six-lane road shimmering in bright afternoon light, a small car moving through all that ordinary white. Heat rising off the lanes in slow, lazy ribbons. Tapioca driving. The Carrier riding passenger. Two kids in the afternoon, ordinary as bread."], ["p", 0, "4:15 PM. Senior Prom Night."], ["p", 0, "The errand was simple. His father's hand had put the beer in the back seat, voice flat and final:"], ["p", 0, "\"Take this to the room. Don't touch it till you're there.\""], ["p", 0, "An errand. That was all it was supposed to be."], ["p", 0, "Safe fun waiting for you in the Hotel Room. All ready."], ["p", 0, "Fifteen minutes away from him. Then the car pulled up alongside them, pacing."], ["p", 0, "A woman driving. A man folded low in the passenger seat — the kind of man just waiting for a reason. The Carrier's eyes flicked over. Less than a look. A glance. The kind that costs nothing on a normal Tuesday.", "A woman driving. A man folded low in the passenger seat,  the kind of man just waiting for a reason. The Carrier's eyes flicked over. Less than a look. A glance. The kind that costs nothing on a normal Tuesday."], ["p", 0, "The man took it wrong."], ["p", 0, "Took it as territory. Took it as a challenge written in the language of a world the boy hadn't known he'd entered."], ["p", 0, "The bird came up over the door."], ["p", 0, "The Carrier — young, dumb, alive in the way that has no sense of consequence — flipped it right back. And behind the man's eyes, the rage caught. Hot. Instant. Out of all proportion to a look on a bright afternoon. Some men are just holding the match. They're only waiting for a room to walk into.", "The Carrier,  young, dumb, alive in the way that has no sense of consequence,  flipped it right back. And behind the man's eyes, the rage caught. Hot. Instant. Out of all proportion to a look on a bright afternoon. Some men are just holding the match. They're only waiting for a room to walk into."], ["p", 0, "The passenger hauled himself up onto the window sill, half out of the moving car, hurling something at their car. Something cracked off the windshield. He waved — come on, up here — and the boy read it as meant for him.", "The passenger hauled himself up onto the window sill, half out of the moving car, hurling something at their car. Something cracked off the windshield. He waved,  come on, up here,  and the boy read it as meant for him."], ["p", 0, "It wasn't."], ["p", 0, "A second car was already moving. Long and full, coming up fast from behind like dogs let off a chain. Six, seven men inside it, faceless as traffic. This had never been one man's temper. This was a hunt, with more teeth than the road could see yet."], ["p", 0, "The long car whipped around in front and stood on the brakes. Rubber shrieked. The whole afternoon leaned forward. The small car boxed in — no room, no exit, no version of what happened next that didn't start with the passenger window.", "The long car whipped around in front and stood on the brakes. Rubber shrieked. The whole afternoon leaned forward. The small car boxed in,  no room, no exit, no version of what happened next that didn't start with the passenger window."], ["p", 0, "A shape at his window."], ["p", 0, "A box cutter. A bare edge in its hand."], ["p", 0, "Before his brain could file the shape as a blade — it was through the open window and through his arm. Muscle. Then the deep cold wrongness of bone. Blood sheeting off the elbow onto the door, onto the lane.", "Before his brain could file the shape as a blade,  it was through the open window and through his arm. Muscle. Then the deep cold wrongness of bone. Blood sheeting off the elbow onto the door, onto the lane."], ["p", 0, "Then Tapioca's voice, wild and certain:"], ["p", 0, "\"Get out — we're surrounded.\"", "\"Get out,  we're surrounded.\""], ["p", 0, "So they got out."], ["p", 0, "Two boys stepping into the middle of six screaming lanes, the whole carload closing on them from every side. The horns started. The horns never stopped. A choir with one note. A hundred strangers watching from inside their glass and steel, leaning on the only language they had. It changed nothing. He registered it only as weather."], ["p", 0, "The first man jumped him. A second swung — a weapon still in his fist, cracking off the side of his head. White flash. Taste of pennies.", "The first man jumped him. A second swung,  a weapon still in his fist, cracking off the side of his head. White flash. Taste of pennies."], ["p", 0, "He got his hands into the first man anyway. Picked him clean off the road. Slammed him onto the asphalt. Dropped a knee. Closed a hand on the throat. The man's heels were drumming the road. A drumroll on hot blacktop, getting slower. He was winning this one — with zero thoughts of stopping.", "He got his hands into the first man anyway. Picked him clean off the road. Slammed him onto the asphalt. Dropped a knee. Closed a hand on the throat. The man's heels were drumming the road. A drumroll on hot blacktop, getting slower. He was winning this one,  with zero thoughts of stopping."], ["p", 0, "Then he looked up and saw them."], ["p", 0, "They had Tapioca."], ["p", 0, "Surrounded. Getting cut and stabbed. The boy looked at the man beneath him — the choke, the sure outcome he had in his hands — and he let go. Released the throat. Turned loose the sure thing and went toward his friend instead.", "Surrounded. Getting cut and stabbed. The boy looked at the man beneath him,  the choke, the sure outcome he had in his hands,  and he let go. Released the throat. Turned loose the sure thing and went toward his friend instead."], ["p", 0, "I let go of the sure thing to save my friend. The only math I've ever known how to do."], ["p", 0, "The instant he turned loose — a hit from the blind side. He got under it, lifted the new man clean off his feet, and threw him into the oncoming lane. A body in the air over black asphalt. The horns. Always the horns. He hit him with Fists of Rage. Then another man was under him: full mount, ground and pound, like a warrior.", "The instant he turned loose,  a hit from the blind side. He got under it, lifted the new man clean off his feet, and threw him into the oncoming lane. A body in the air over black asphalt. The horns. Always the horns. He hit him with Fists of Rage. Then another man was under him: full mount, ground and pound, like a warrior."], ["p", 0, "From behind, a fist grabbed his shirt and hauled it up, baring his back."], ["p", 0, "What happened next was so soft-feeling he never noticed — a line drawn down the spine, not a stab but a drawing, slow and bright, the blade doing its slow geography. Then the blade found the tattoo on his right shoulder blade, tried to cut it, and missed, a kind of underline, the blood running warm into his waistband before the pain even filed its report.", "What happened next was so soft-feeling he never noticed,  a line drawn down the spine, not a stab but a drawing, slow and bright, the blade doing its slow geography. Then the blade found the tattoo on his right shoulder blade, tried to cut it, and missed, a kind of underline, the blood running warm into his waistband before the pain even filed its report."], ["p", 0, "Then a fist in his hair, hauling."], ["p", 0, "The head snapped back. The blade opened the back of his skull, crown to nape — one long cold unzipping. The world tipped. Sky where the asphalt should be. A warm curtain coming down over one eye.", "The head snapped back. The blade opened the back of his skull, crown to nape,  one long cold unzipping. The world tipped. Sky where the asphalt should be. A warm curtain coming down over one eye."], ["p", 0, "He could feel the neck exposed. Could feel the throat pulled long and bared to the afternoon. He understood, in the wordless way the body understands before the mind catches up, that this was where the night had always been driving."], ["p", 0, "The next cut was the last one."], ["p", 0, "It never fell."], ["p", 0, "Tapioca came over the hood of a car."], ["p", 0, "Over it — spending a body he had no business still standing in — arms wide, impossibly airborne, a shadow crossing the sun, landing on the man with the blade. Into his head. The knife went wide. The throat closed.", "Over it,  spending a body he had no business still standing in,  arms wide, impossibly airborne, a shadow crossing the sun, landing on the man with the blade. Into his head. The knife went wide. The throat closed."], ["p", 0, "Somebody who had every reason to save his own skin spent it instead. Came over the car for me. I was young. I learned the only theology I've ever fully trusted: the finish doesn't have to land."], ["p", 0, "He came back down into his own body inside a lake of red. No choreography anymore — a drowning. Swinging every direction at once, blind in one eye, unable to tell his blood from theirs from the road's.", "He came back down into his own body inside a lake of red. No choreography anymore,  a drowning. Swinging every direction at once, blind in one eye, unable to tell his blood from theirs from the road's."], ["p", 0, "In the fog, something went in that wasn't going to come out."], ["p", 0, "Where every other cut had drawn its line and pulled away, this one went to the handle and stayed. Not a wound you point to on a chart. Something the afternoon had been carrying since the beer in the back seat, since the flat voice, since the hotel room he'd been hauling all day like it was ordinary."], ["p", 0, "One more truck locked up its brakes, a voice yelling out of it, \"I AM A COP\" — long, human, wrong. Something in that sound broke the spell. The seven scattered back into the traffic they had come out of. Gone as fast as they came.", "One more truck locked up its brakes, a voice yelling out of it, \"I AM A COP\",  long, human, wrong. Something in that sound broke the spell. The seven scattered back into the traffic they had come out of. Gone as fast as they came."], ["p", 0, "Two boys left standing in the middle of a stopped highway, counting their own leaks."], ["p", 0, "The horns finally quiet. Somewhere an engine ticking as it cooled."], ["p", 0, "What Tapioca carried out of that road is his own to tell."], ["p", 0, "The Carrier: the arm open to the bone. The spine. The shoulder blade. The scalp, crown to nape. What went in, still in him. Standing. The right arm held a little away from the body, already learning the shape it would keep."], ["p", 0, "He got into the car. Put his hand on the gearbox. Every shift was a fresh scream from an arm that was more open than closed — muscle and bone arguing through every gear. He drove. The red filling the seat. The red on the wheel. The white road unspooling ahead.", "He got into the car. Put his hand on the gearbox. Every shift was a fresh scream from an arm that was more open than closed,  muscle and bone arguing through every gear. He drove. The red filling the seat. The red on the wheel. The white road unspooling ahead."], ["p", 0, "The next lot. The car stopping crooked. The door opening. The ground coming up to meet him."], ["p", 0, "A crowd gathered the way crowds do — too late and too loud. A face over him, a mouth moving, the sound going far away. The voices went under, like a radio carried into water. The last thing in the world was the one color that had been in it the whole time.", "A crowd gathered the way crowds do,  too late and too loud. A face over him, a mouth moving, the sound going far away. The voices went under, like a radio carried into water. The last thing in the world was the one color that had been in it the whole time."], ["p", 0, "And then the black."], ["p", 0, "•  •  •", ""], ["p", 0, "The light came back up before he did."], ["p", 0, "Not the blown-out afternoon kind. Fluorescent. Cold. A different light doing a different job. It hummed, and the hum went straight into his teeth. His father was already there. Had beaten the ambulance to the doors."], ["p", 0, "Behind the gurney, a line followed him in across the tile — red, dragging, marking the whole length of the hallway.", "Behind the gurney, a line followed him in across the tile,  red, dragging, marking the whole length of the hallway."], ["p", 0, "His father didn't sit."], ["p", 0, "There was a chair. He never touched it."], ["p", 0, "The doctor laid it out plain over a boy opened in four places."], ["p", 0, "\"We can close this properly. Thirty thousand stitches, small scarring, but it's going to take most of the night and into tomorrow.\""], ["p", 0, "\"I've got somewhere to be tonight.\""], ["p", 0, "\"Then it's staples. A hundred of them, give or take. You'll carry the scar the rest of your life.\""], ["p", 0, "Staples."], ["p", 0, "k-CHUNK."], ["p", 0, "The first staple went in like a nail gun closing an argument. Then another. Then the rhythm of it — punch, click, punch, click — laying a line down his spine that the rest of this book would hang its whole binding on. He didn't flinch. There wasn't room left in him to flinch.", "The first staple went in like a nail gun closing an argument. Then another. Then the rhythm of it,  punch, click, punch, click,  laying a line down his spine that the rest of this book would hang its whole binding on. He didn't flinch. There wasn't room left in him to flinch."], ["p", 0, "By the time the night had gone all the way black, a building stood up against the sky. Their dates did the buttons. Careful hands over a shirt with a hundred staples underneath it, working a collar shut around a neck that had almost not made it to the hour."], ["p", 0, "Then the doors."], ["p", 0, "Two boys walking in — stitched, stapled, upright on will alone. Prom night. The gym doing what gyms do. Music. Bodies. A night that had no idea what it was standing on.", "Two boys walking in,  stitched, stapled, upright on will alone. Prom night. The gym doing what gyms do. Music. Bodies. A night that had no idea what it was standing on."], ["p", 0, "He didn't dance. Couldn't. Stood at the edge of the floor instead, the wound still open under the shirt, staples pulling with every breath, and let the light hit his face anyway."], ["p", 0, "Morning came up ordinary, which felt like its own kind of violence — the world going on plain and daylit like nothing had happened, while a boy walked through it with a hundred staples holding his back together.", "Morning came up ordinary, which felt like its own kind of violence,  the world going on plain and daylit like nothing had happened, while a boy walked through it with a hundred staples holding his back together."], ["p", 0, "That was the day he met The Early Cold. Two people, nothing more than that yet. They trauma bonded and did not even know it."], ["p", 0, "He didn't know yet what she'd cost him, or what he'd cost her. He only knew he was still standing, staples and all, and that the standing had to count for something."], ["p", 0, "I was unbearable to live with."], ["p", 0, "The Early Cold did not invent that. She was reporting from inside the blast radius. He brought the corridor home and set it on the table and expected a woman to eat around it. She couldn't. Nobody could have."], ["p", 0, "The scar down his spine had already chosen its shape — in a hospital room, under a clock, in the space between a hundred staples and a night he refused to miss.", "The scar down his spine had already chosen its shape,  in a hospital room, under a clock, in the space between a hundred staples and a night he refused to miss."], ["p", 0, "Everything after hung off that line."], ["h", 2, "THE CORRIDOR OPENS"], ["p", 0, "The Wire Shop. The Gateway."], ["p", 0, "Getting up off the asphalt."], ["p", 0, "Not as a metaphor. Literally getting the boots underneath the hips, standing up, and putting on a collar."], ["p", 0, "The Wire Shop. Floor sales. Pagers, cellular contracts, plastic handsets across a laminate counter scarred with cigarette burns nobody had bothered to sand out, under the buzz of fluorescent ballasts that never fully warmed up — the same indifferent note the hospital room had used, same light doing a different nothing.", "The Wire Shop. Floor sales. Pagers, cellular contracts, plastic handsets across a laminate counter scarred with cigarette burns nobody had bothered to sand out, under the buzz of fluorescent ballasts that never fully warmed up,  the same indifferent note the hospital room had used, same light doing a different nothing."], ["p", 0, "He kept the feet moving. Because stopping meant looking down at what was torn open underneath the shirt, and what was underneath was a fresh line that hadn't yet decided how much it was going to cost him."], ["p", 0, "Motion is medication."], ["p", 0, "The body learned the first rule early and applied it without asking the mind's permission. A shark does the same with water. The mind was busy with other things: the child support docket. The bar tab that grew where the child support money should have been. The transactions on no register that covered what the transactions on record couldn't."], ["p", 0, "The bars were friends the way the cold is warm when you've been outside long enough. They filled what needed filling. They never asked questions. They never kept promises either, but at the time those two things felt like the same animal."], ["p", 0, "Pain was easy to kill."], ["p", 0, "That was the first and most dangerous truth the corridor taught him."], ["p", 0, "Far from The White, at first. Closer to The Green — serving the needs of many, especially his own. A transaction at a time.", "Far from The White, at first. Closer to The Green,  serving the needs of many, especially his own. A transaction at a time."], ["p", 0, "Gateway Drive. The Gateway. The first apartment with his name on it alone. A velvet couch. A mirror coffee table, circle-cut, mounted on a spin — the kind of furniture that tells you exactly what era it belongs to without a word of explanation — and a razor that lived permanently in its corner like a fixture nobody remembered installing.", "Gateway Drive. The Gateway. The first apartment with his name on it alone. A velvet couch. A mirror coffee table, circle-cut, mounted on a spin,  the kind of furniture that tells you exactly what era it belongs to without a word of explanation,  and a razor that lived permanently in its corner like a fixture nobody remembered installing."], ["p", 0, "The room had its own economy. The Wire Shop counter was the day job."], ["p", 0, "The circle table was the night shift."], ["p", 0, "After midnight the apartment filled up with people who were not company. Voices in the kitchen. A laugh from a bedroom that was not his. Somebody always needing a thing. Somebody always holding cash like it was going to burn. He sat at the table and did the work. Line. Cut. Serve. The White making everyone in the room the most important person in the room — until it didn't. Then the room emptied, and he was still in the chair. The cushion held the shape of him like a mold.", "After midnight the apartment filled up with people who were not company. Voices in the kitchen. A laugh from a bedroom that was not his. Somebody always needing a thing. Somebody always holding cash like it was going to burn. He sat at the table and did the work. Line. Cut. Serve. The White making everyone in the room the most important person in the room,  until it didn't. Then the room emptied, and he was still in the chair. The cushion held the shape of him like a mold."], ["p", 0, "A house full of people with nobody in the room."], ["p", 0, "Just his thoughts, getting louder."], ["p", 0, "The White moved in closer. The world of needy people to serve got wider — especially The Industry. He met lots of friends that way. He met nobody that way. Both things true at the same time, and that contradiction sat in his chest and never asked permission.", "The White moved in closer. The world of needy people to serve got wider,  especially The Industry. He met lots of friends that way. He met nobody that way. Both things true at the same time, and that contradiction sat in his chest and never asked permission."], ["p", 0, "The First Son was born."], ["p", 0, "He was so proud he didn't know what to do with his hands."], ["p", 0, "Scared and proud at the same time — not competing feelings, the same feeling with two names. The boy was so small. All of him fit in the crook of one scarred arm. He held him and did not know what to do. He was not good at being a father yet. He knew it in real time. He held him anyway.", "Scared and proud at the same time,  not competing feelings, the same feeling with two names. The boy was so small. All of him fit in the crook of one scarred arm. He held him and did not know what to do. He was not good at being a father yet. He knew it in real time. He held him anyway."], ["p", 0, "Amazing."], ["p", 0, "That is the only word that survives the translation. He would not trade it. Not a second. He only wished the tools had already been in place when the boy arrived — that the scar had already been processed, the hallways already walked, the lesson already learned. He got the child before he got the equipment. That's not a complaint. That's just the order it came in.", "That is the only word that survives the translation. He would not trade it. Not a second. He only wished the tools had already been in place when the boy arrived,  that the scar had already been processed, the hallways already walked, the lesson already learned. He got the child before he got the equipment. That's not a complaint. That's just the order it came in."], ["p", 0, "The Early Cold had a verdict ready before the closing argument. Said it standing in a doorway with her arms already crossed, like she'd rehearsed the stance more than the words."], ["p", 0, "\"You'll be nothing. Just like your father.\""], ["p", 0, "She delivered it clean. No heat. Just the sentence, set down flat on the table and left there for him to pick up or step over."], ["p", 0, "Months after the birth, the deadbolt closed."], ["p", 0, "The sound of it was small. Metal on metal. It carried through the whole house."], ["p", 0, "He picked up the pace because stopping meant sitting with the verdict, and the verdict was loud in a quiet room."], ["p", 0, "And while he was trying to build a wall, the bedrock gave out underneath him."], ["p", 0, "His own father lost the house."], ["p", 0, "Losing a man to death has a shape to it. You can point to the moment. You can hold the date in your hand like a stone. Losing a man to The Glass Ghost is something else entirely — you can see the body standing right in front of you and understand that nobody is home. The door is open and the room is empty. He's there and he's not there, and the version that's not there keeps winning, keeps taking ground, keeps burning down whatever the other version was trying to build.", "Losing a man to death has a shape to it. You can point to the moment. You can hold the date in your hand like a stone. Losing a man to The Glass Ghost is something else entirely,  you can see the body standing right in front of you and understand that nobody is home. The door is open and the room is empty. He's there and he's not there, and the version that's not there keeps winning, keeps taking ground, keeps burning down whatever the other version was trying to build."], ["p", 0, "I saw what The Glass Ghost did to the one person I looked up to. And it ended him."], ["p", 0, "A doorframe. A man he recognized standing in it. The light wrong. The posture wrong. The room behind him empty in a way rooms shouldn't be. That image lives in the archive now — locked, irreducible, the kind of thing the mind photographs without being asked.", "A doorframe. A man he recognized standing in it. The light wrong. The posture wrong. The room behind him empty in a way rooms shouldn't be. That image lives in the archive now,  locked, irreducible, the kind of thing the mind photographs without being asked."], ["p", 0, "He understood something in that doorframe. He understood it the way a man understands something he does not yet have the language for — something he would spend the next several years slowly approaching from the outside, building the vocabulary word by word. He understood that a substance could hollow a man out so completely that the man's whole body became a false front, a façade with nothing behind it. A movie set. Painted brick, and open air behind it. He understood it not as an abstraction, not as a warning label, but as a specific person he had loved. He saw the destination. He saw the end state. He filed it away in whatever part of him was still keeping notes.", "He understood something in that doorframe. He understood it the way a man understands something he does not yet have the language for,  something he would spend the next several years slowly approaching from the outside, building the vocabulary word by word. He understood that a substance could hollow a man out so completely that the man's whole body became a false front, a façade with nothing behind it. A movie set. Painted brick, and open air behind it. He understood it not as an abstraction, not as a warning label, but as a specific person he had loved. He saw the destination. He saw the end state. He filed it away in whatever part of him was still keeping notes."], ["p", 0, "Then he went back to The Gateway and sat at the spinning table in the dark."], ["p", 0, "Nothing. Just like your father."], ["p", 0, "He sat with that a long time."], ["p", 0, "•  •  •", ""], ["p", 0, "The estate sale happened on a Tuesday."], ["p", 0, "One day. No truck. No help. No one coming. One day to pull a life out of the walls before the Glass Ghost's creditors arrived with a different plan for everything inside."], ["p", 0, "What came instead was strangers. People he had never seen, walking the hallways, opening drawers, holding up the artifacts of a family and naming a price. Cash going straight into the hand of a man they all knew would be on Gateway Drive with it before dark. Everyone knew."], ["p", 0, "The transaction happened anyway."], ["p", 0, "Trophies. Plaques. Medals. A lifetime in sport — every game played, every line run, every hit taken, every morning woken up before light to be somewhere and be something — laid out on tables. Strangers turned them over in their hands. Checked for scratches. Put them back down or tucked them under an arm. The names on the back meant nothing to anyone in that room except the boy watching it happen. Brass and plastic turning under strangers' thumbs, a life being weighed by the pound.", "Trophies. Plaques. Medals. A lifetime in sport,  every game played, every line run, every hit taken, every morning woken up before light to be somewhere and be something,  laid out on tables. Strangers turned them over in their hands. Checked for scratches. Put them back down or tucked them under an arm. The names on the back meant nothing to anyone in that room except the boy watching it happen. Brass and plastic turning under strangers' thumbs, a life being weighed by the pound."], ["p", 0, "His mother had built a pond in the backyard with her own hands. His father had built a Tiki Bar on the side of the house. Evidence of people who had made something. People who had stood in a yard and decided to build rather than leave. It was all still there. The pond. The bar. The yard. The glass gone out of the man who built it."], ["p", 0, "The neighbors didn't come out."], ["p", 0, "Not one. People who had watched him learn to walk, who had eaten at that table, who had borrowed tools from that garage and brought casseroles to that door — they went inside and pulled their blinds. Slats snapping shut down the whole street, one after another, like a row of eyelids. The street was quiet the way streets go quiet when everyone decides not to see something.", "Not one. People who had watched him learn to walk, who had eaten at that table, who had borrowed tools from that garage and brought casseroles to that door,  they went inside and pulled their blinds. Slats snapping shut down the whole street, one after another, like a row of eyelids. The street was quiet the way streets go quiet when everyone decides not to see something."], ["p", 0, "That silence was louder than the strangers. Louder than the cash. Louder than anything that happened inside that house that day. It is still the loudest thing I have ever heard."], ["p", 0, "The house was full when he walked out."], ["p", 0, "They locked the door behind him like he was the one who didn't belong there."], ["p", 0, "I walked away from the house I grew up in while strangers picked through what was left of us. The neighbors pulled their blinds. That's the one I still carry."], ["p", 0, "He kept moving. Motion is medication. The body applied the rule even when the mind wasn't sure there was anything left worth applying it to."], ["h", 2, "TWO ENGINES & THE LIMESTONE FIELD"], ["p", 0, "The Red Label Line. The High-Rise Carrier."], ["p", 0, "He worked two shifts because the arithmetic offered no other exit."], ["p", 0, "The Red Label Line. Midnight shifts. HAZMAT certified. Sorting, stacking, and throwing heavy freight in the freezing terminal bays before the sun had cleared the tree line. Memorizing chemical placard numbers. Running the sorting belts. Taking the physical routes nobody else bid on, because the dangerous freight carried a pay differential, and the legal ledger didn't care where the money came from — only that it cleared.", "The Red Label Line. Midnight shifts. HAZMAT certified. Sorting, stacking, and throwing heavy freight in the freezing terminal bays before the sun had cleared the tree line. Memorizing chemical placard numbers. Running the sorting belts. Taking the physical routes nobody else bid on, because the dangerous freight carried a pay differential, and the legal ledger didn't care where the money came from,  only that it cleared."], ["p", 0, "Boxes with the red label that meant if you dropped them wrong, you didn't get to go home. His breath in the air. The dock loud enough to drown thought, which was the point."], ["p", 0, "Then the daytime shift at The High-Rise Carrier. The retail uniform pulled over a body that had not slept. The headset. The sales targets. The walk-in traffic looking for someone to absorb their complaints. The smile that was a tool."], ["p", 0, "He ran both operations side by side, for years."], ["p", 0, "Two engines, one body, no oil change."], ["p", 0, "He was trying to cut a path out."], ["p", 0, "The Limestone Field. College football pads. Lecture halls. A degree. The clean blueprint of a man who could stand in front of his firstborn, years down the road, and say it out loud."], ["p", 0, "I built a wall. I didn't just hide behind one."], ["p", 0, "He made real friends there. That part was true. He ran stairs for being late to practice — always late, always running, always arriving at something already in motion. The Limestone Field had a version of him that could have gone somewhere.", "He made real friends there. That part was true. He ran stairs for being late to practice,  always late, always running, always arriving at something already in motion. The Limestone Field had a version of him that could have gone somewhere."], ["p", 0, "But the Devil moved there with him."], ["p", 0, "Whatever was already in the arsenal — The Green, the bars, the spinning table — the Limestone Field added a new elevation. The White arrived in full. The kind that made you the happiest person in any room. The kind that made the getting-down afterward feel like a tax worth paying, until it wasn't, and by the time it wasn't, the habit was already a resident. Already paying rent. Already comfortable. Already looking at you like you owe it something.", "Whatever was already in the arsenal,  The Green, the bars, the spinning table,  the Limestone Field added a new elevation. The White arrived in full. The kind that made you the happiest person in any room. The kind that made the getting-down afterward feel like a tax worth paying, until it wasn't, and by the time it wasn't, the habit was already a resident. Already paying rent. Already comfortable. Already looking at you like you owe it something."], ["p", 0, "The blueprint required tuition. Tuition required cash. Cash required running two engines until the bearings glowed."], ["p", 0, "The courtroom did not care about the blueprint. It noticed the income from the stretch of double shifts. It did not notice what those shifts had cost. They taxed the dream at the rate of his highest exhaustion."], ["p", 0, "\"Your Honor, the income reflects a temporary period of overtime, not—\"", "\"Your Honor, the income reflects a temporary period of overtime, not, \""], ["p", 0, "\"The number is the number.\""], ["p", 0, "He sat at the defendant's table in the county courthouse and watched the gavel fall on an income he no longer had, for an ambition they had no interest in preserving. One crack of wood, and the whole blueprint came apart in his hands. One isolated number, written in the ledger in the language the court used — cold, abstract, permanent. A figure that now owned a portion of everything he would ever earn.", "He sat at the defendant's table in the county courthouse and watched the gavel fall on an income he no longer had, for an ambition they had no interest in preserving. One crack of wood, and the whole blueprint came apart in his hands. One isolated number, written in the ledger in the language the court used,  cold, abstract, permanent. A figure that now owned a portion of everything he would ever earn."], ["p", 0, "He closed the textbooks. Packed the gear. Went straight back to the loading dock."], ["p", 0, "The degree stayed in the dirt."], ["p", 0, "The Limestone Field became a ghost corridor. Another hallway that had looked like an exit and turned out to be another way deeper in."], ["h", 2, "THE LOOSE SCREW"], ["p", 0, "The party circuit."], ["p", 0, "The party circuit. Nightclubs. Bass bins. Parking lot exhausts. After-hours apartments that smelled like cigarettes and spilled rum and whatever the night had promised before it cashed the check. Bass in the chest like a second, borrowed heartbeat."], ["p", 0, "The Loose Screw sat in the passenger seat and worked the frame the way rust works — slow, daily, committed. Every bar booth. Every morning drive. Every quiet second between songs.", "The Loose Screw sat in the passenger seat and worked the frame the way rust works,  slow, daily, committed. Every bar booth. Every morning drive. Every quiet second between songs."], ["p", 0, "You are nothing. You will always be nothing. You should be grateful I stay."], ["p", 0, "\"You know nobody else would put up with you.\""], ["p", 0, "He didn't answer. There wasn't an answer that shortened the ride."], ["p", 0, "She hit him."], ["p", 0, "More than once. More than twice. In the car. In the kitchen. In the quiet after, like the quiet was what had earned it. He took it. The math stopped mattering around the time the math started feeling normal."], ["p", 0, "The last time was the last time."], ["p", 0, "That is the whole sentence."], ["p", 0, "He got the apartment. His sister moved in — real blood, solid ground, the kind that doesn't require maintenance or explanation. Just presence. She was there. A light left on in a hallway.", "He got the apartment. His sister moved in,  real blood, solid ground, the kind that doesn't require maintenance or explanation. Just presence. She was there. A light left on in a hallway."], ["p", 0, "Every other weekend The First Son came. Forty-eight hours where the man in the apartment had to be a different version of himself. Steadier. Quieter. The kind of man a boy could rest against. He wasn't good at it yet. He showed up anyway."], ["p", 0, "That's what the record shows."], ["p", 0, "He showed up."], ["h", 2, "THE KISS OF DEATH"], ["p", 0, "Freshman year. Then years later."], ["p", 0, "This happened freshman year of high school."], ["p", 0, "His mother made him break up with her. So she had a man come to his house with a gun, and she waited at the end of the street."], ["p", 0, "That day she drove past him. She held up two fingers, the middle one laid over the index, a small triangle, and pressed them to her lips like a kiss. She kept the fingers just like that and flipped them over onto her chest."], ["p", 0, "He flipped her off. He knew she had someone coming to kill him."], ["p", 0, "She jumped out of the car and ran to him and asked why he flipped her off. He said it was the hand gesture. He had no clue what it meant. It looked like a gang sign she was kissing."], ["p", 0, "She said no, it was just The Kiss of Death. Because he was gonna get shot tonight. That is where she got the name."], ["p", 0, "He had never heard of the sign."], ["p", 0, "He was still a kid when the man walked up the breezeway that night. He heard the steps. Slow. Unhurried. He did not hide. He walked out and got in the man's face."], ["p", 0, "\"So I hear you are here to kill me.\""], ["p", 0, "The man showed the pistol in his waistband. Didn't say a word. Just showed it. Black, small, enormously quiet."], ["p", 0, "\"Well go ahead and do it if you are going to.\""], ["p", 0, "He didn't."], ["p", 0, "He fumbled around. Finally he said, \"Man you shouldn't have done that to her.\""], ["p", 0, "\"Man my mom made me do it, my mom found notes of where she wanted me to take her virginity so I am not going against my mom and why did you let her talk you into it.\""], ["p", 0, "\"You want to ask her cause she is at the end of the street.\""], ["p", 0, "So they walked down there. He has no details on what was said there. But none of them ever tried anything on him again, because he was not scared of anything."], ["p", 0, "She had been at the end of the street. Waiting on it to be done. He understood then, without a word of it needing to be said, that some people send a thing they will not watch land."], ["p", 0, "•  •  •", ""], ["p", 0, "Years later — years — he and The Kiss of Death got back together.", "Years later,  years,  he and The Kiss of Death got back together."], ["p", 0, "They had a son. The Boy in the Wind."], ["p", 0, "For a moment it looked like something that could work. The First Son and The Boy in the Wind got along — two brothers who hadn't had a reason to be enemies yet. He could love both his sons in the same room at the same time. For one stretch of afternoons, the house sounded like a family. He didn't clock the exits.", "For a moment it looked like something that could work. The First Son and The Boy in the Wind got along,  two brothers who hadn't had a reason to be enemies yet. He could love both his sons in the same room at the same time. For one stretch of afternoons, the house sounded like a family. He didn't clock the exits."], ["p", 0, "He should have clocked the exits."], ["p", 0, "The weekends started going wrong. Every weekend he had The First Son, she left. Not a coincidence. A policy. She started telling him to choose. The First Son was not allowed in The Show Me State — that was the wall — and when she moved, the wall moved with her.", "The weekends started going wrong. Every weekend he had The First Son, she left. Not a coincidence. A policy. She started telling him to choose. The First Son was not allowed in The Show Me State,  that was the wall,  and when she moved, the wall moved with her."], ["p", 0, "He could not choose. He would never choose. A man who throws himself into six lanes of traffic to save a friend does not choose between his children."], ["p", 0, "So when she moved, he moved with her, and he drove back to Rocket Valley for The First Son, and that was the arrangement."], ["p", 0, "Until it wasn't."], ["p", 0, "Tuck tail and run."], ["h", 2, "THE WAR BEFORE THE FIRST BREATH"], ["p", 0, "The Show Me State."], ["p", 0, "The war started before the child had a pulse on an ultrasound."], ["p", 0, "He fought her off the clinic steps. He fought her off the adoption agencies. He stood in the living room and laid his title down with both hands:"], ["p", 0, "\"I will take full custody. Sign him over to me.\""], ["p", 0, "She looked him in the face and said:"], ["p", 0, "\"Never.\""], ["p", 0, "The Boy in the Wind was born anyway. Dropped straight into a crossfire zeroed in before his lungs took their first breath. A newborn's first cry, with the guns already trained on the room."], ["p", 0, "He held him."], ["p", 0, "Family had been told to go home. Not allowed in — not today, not on her terms. Just the two of them in that room. The boy looked up. He looked back.", "Family had been told to go home. Not allowed in,  not today, not on her terms. Just the two of them in that room. The boy looked up. He looked back."], ["p", 0, "Just the two of them, in the space she couldn't take."], ["p", 0, "Amazing."], ["p", 0, "Both sons had given him that word, each time meaning something different, each time meaning exactly the same thing."], ["h", 2, "THE IRON YARD"], ["p", 0, "North Alabama."], ["p", 0, "He was a natural on the asphalt."], ["p", 0, "The Iron Yard. North Alabama automotive lot, gravel and diesel. He could read the posture of a customer before they hit the showroom door — locate the exact space between what a buyer said they could afford and what they were terrified of losing. Commission was the only vehicle that paid fast enough to keep the legal threats at bay. He worked it because he was good at it, and being good at something — even just this — was something to hold.", "The Iron Yard. North Alabama automotive lot, gravel and diesel. He could read the posture of a customer before they hit the showroom door,  locate the exact space between what a buyer said they could afford and what they were terrified of losing. Commission was the only vehicle that paid fast enough to keep the legal threats at bay. He worked it because he was good at it, and being good at something,  even just this,  was something to hold."], ["p", 0, "Then the floor buckled."], ["p", 0, "Not a crack. A drop. The whole lot tilting under his shoes."], ["p", 0, "Painkillers first. Then selling to support the habit. The numbers on the ledger required a supplement, and the supplement required a market, and the market was everywhere once you knew how to look."], ["p", 0, "The mark landed in the state database. A permanent record does not negotiate. It waits quietly for years, showing up at background checks and HR desks with the patience of a man who has nowhere else to be."], ["p", 0, "He didn't realize yet that the mark was permanent."], ["p", 0, "The pain was hard to wash away without a killer. You put the two together."], ["p", 0, "The killer didn't arrive with sirens. It never does. It came as a quiet liquid pour at the end of a fourteen-hour turn. Something to take the jagged edges off the court docket. To soften the memory of the gun at the door. To put a buffer between his ribs and the woman holding his second son behind a state line he couldn't cross."], ["p", 0, "The killer was patient. It had all the time in the world, and it knew something the man did not: that a thing you pick up to manage the pain has no interest in the pain ending. It makes itself necessary."], ["p", 0, "It is very good at this."], ["p", 0, "A thin red line entered the story. Quiet. Faint. Settling in. The man didn't see it yet. He was still looking elsewhere — at the debt, at the docket, at the spinning table in the dark.", "A thin red line entered the story. Quiet. Faint. Settling in. The man didn't see it yet. He was still looking elsewhere,  at the debt, at the docket, at the spinning table in the dark."], ["p", 0, "The line waited."], ["h", 2, "THE SHOW ME STATE"], ["p", 0, "The Show Me State."], ["p", 0, "He packed the car and drove north into exile, because The Boy in the Wind was across the state line."], ["p", 0, "That was the whole reason. The only compass he had left. He drove north. He crossed the line. He showed up."], ["p", 0, "She owned the lease. He stayed within the four walls, raising the boy while she worked the day shift. She told him he was worthless. Daily. Like clockwork. He stopped arguing the point somewhere early on, because arguing it meant staying in the room a minute longer than he had to, and the room was where the word lived. The word seemed to rattle in the drywall."], ["p", 0, "The dark taverns became the only sanctuary. A brutal, smoky holding cell when the walls started closing in. Bonfires out in the country. The back rooms of the Gentlemen's Club. A rough, desperate version of himself running through the gravel lots — a man he will not defend and will not deny.", "The dark taverns became the only sanctuary. A brutal, smoky holding cell when the walls started closing in. Bonfires out in the country. The back rooms of the Gentlemen's Club. A rough, desperate version of himself running through the gravel lots,  a man he will not defend and will not deny."], ["p", 0, "The fight that ended it was about The First Son. Whether he was allowed to visit. Whether a man could have both his children in the same state at the same time."], ["p", 0, "She had an answer for that."], ["p", 0, "\"Go be with your illiterate redneck faggot son.\""], ["p", 0, "He slapped her."], ["p", 0, "Immediate regret, no hesitation — both things true at the same second, in the same body, with no distance between them. He ran out the door and into a bar and drowned in whatever was closest to the rail.", "Immediate regret, no hesitation,  both things true at the same second, in the same body, with no distance between them. He ran out the door and into a bar and drowned in whatever was closest to the rail."], ["p", 0, "When he came back to the apartment she was already three steps ahead of him."], ["p", 0, "Then she orchestrated the evacuation."], ["p", 0, "The moving van was not a reaction. The moving van was already arranged. Surgical. He never saw the strike coming."], ["p", 0, "He did not know that yet. He helped load it. He carried her furniture out of the apartment and into the van and drove to her family's place and unloaded it all — box by box, room by room — because that is what you do when you are trying. When you are sorry. When you still believe trying is the same as a chance.", "He did not know that yet. He helped load it. He carried her furniture out of the apartment and into the van and drove to her family's place and unloaded it all,  box by box, room by room,  because that is what you do when you are trying. When you are sorry. When you still believe trying is the same as a chance."], ["p", 0, "Then he went to his truck to unload it."], ["p", 0, "She stopped him. She pointed to the truck."], ["p", 0, "He looked at it for the first time as though someone else had packed it."], ["p", 0, "She had sorted it while he carried her boxes. His things — what little she'd designated as his — already in the truck. Her things — everything — already in the van. He had moved her into her family's house himself, box by box, not understanding he was building the walls that would lock him out. Every box a brick. His own two hands, mortaring.", "She had sorted it while he carried her boxes. His things,  what little she'd designated as his,  already in the truck. Her things,  everything,  already in the van. He had moved her into her family's house himself, box by box, not understanding he was building the walls that would lock him out. Every box a brick. His own two hands, mortaring."], ["p", 0, "It's temporary."], ["p", 0, "It was not temporary."], ["p", 0, "Locks changed, rooms emptied, the child removed while he was out of the house."], ["p", 0, "He returned to a structure scrubbed of his existence. The bed. The clothes. The small things that proved a person had been living there. Gone or moved outside the door in a black garbage bag, depending on its value."], ["p", 0, "No money. No friends. No floor. Weeks in that truck. He slept sitting up, because lying down meant admitting this was where he lived. Breath on the glass. Fogged, then clear, then fogged again, the only clock he had. The lot lights going all night like they were waiting for someone who had somewhere else to be. The city moved around the cab like he wasn't in it — because to the city, he wasn't. A man can disappear in a parking lot in a way he cannot disappear in a house. Houses have addresses. Trucks have hours.", "No money. No friends. No floor. Weeks in that truck. He slept sitting up, because lying down meant admitting this was where he lived. Breath on the glass. Fogged, then clear, then fogged again, the only clock he had. The lot lights going all night like they were waiting for someone who had somewhere else to be. The city moved around the cab like he wasn't in it,  because to the city, he wasn't. A man can disappear in a parking lot in a way he cannot disappear in a house. Houses have addresses. Trucks have hours."], ["p", 0, "Homeless on the Eastside."], ["p", 0, "He got behind a bar. Pulling taps. Slinging rail liquor at three hundred and fifty dollars a night. He worked the rush, ran the room, traded drinks for survival in a city where nobody knew his real name. He got a place on the Loop and built something out of nothing in a city that owed him nothing back."], ["p", 0, "Strip bars serve ribeye at 7am if you stay up long enough."], ["p", 0, "Then she told him she was carrying his child again."], ["p", 0, "He was so excited."], ["p", 0, "He pleaded. He laid every argument down. He put every card on the table he had ever held and said every true thing available to him."], ["p", 0, "The clinic doors closed anyway."], ["p", 0, "He stood outside them. That is the whole geography of it. A man on the wrong side of a door, with every true thing he had ever held already said, and none of it having been enough. The building did not care. Buildings don't. They take what they take and they keep their hours. Glass doors, locked, his own face floating in them."], ["p", 0, "The day I died more."], ["p", 0, "With every breath I took imagining the breaths being stolen from my unborn child with nothing I could do to stop it."], ["p", 0, "She packed the remainder of her life."], ["p", 0, "She disappeared again. Moved."], ["p", 0, "He walked out into the parking lot. Car dead. Pockets empty. The killer running through his bloodstream. Every road on the map ending in a wall."], ["p", 0, "He stood in the dark, and the dark just looked back at him."], ["h", 2, "TUCK TAIL AND RUN"], ["p", 0, "South."], ["p", 0, "He turned the radiator south and drove back toward Alabama."], ["p", 0, "Not as a conqueror. Not with a single wound stitched closed, a single ledger balanced, a single thing in the car that amounted to a plan. He drove south because south was the only direction left, and the only thing waiting there was the starting point — the asphalt, the town that had cut him open and kept going. Headlights pulling the road toward him, mile after black mile.", "Not as a conqueror. Not with a single wound stitched closed, a single ledger balanced, a single thing in the car that amounted to a plan. He drove south because south was the only direction left, and the only thing waiting there was the starting point,  the asphalt, the town that had cut him open and kept going. Headlights pulling the road toward him, mile after black mile."], ["p", 0, "Tuck tail and run."], ["p", 0, "She had drifted back to Rocket Valley too. He went straight back into the fire to find his boy. She raised the walls and guarded the perimeter."], ["p", 0, "The hallway didn't end when he crossed the state line. It just changed its wallpaper."], ["p", 0, "He kept walking."], ["h", 2, "I SEE YOU, BROTHER"], ["p", 0, "This is not a wound he gets to tell. It belongs to somebody else, and the book will not take it from him."], ["p", 0, "But there is one thing that needs saying straight at him, out loud, no third person standing between them this time."], ["p", 0, "More than the scar. More than what could be seen on that highway — it's the wound that was left behind. The wound he carries.", "More than the scar. More than what could be seen on that highway,  it's the wound that was left behind. The wound he carries."], ["p", 0, "For the longest time he didn't know it was there. Tapioca was always somewhere else — the jungle, adventures, everywhere a man could imagine, happy and strong, like he had it all together. World traveler. Always. So he pushed himself to be like him. And every time he fell short, he went further into his own wounds, because he was nowhere near what the outside kept showing him.", "For the longest time he didn't know it was there. Tapioca was always somewhere else,  the jungle, adventures, everywhere a man could imagine, happy and strong, like he had it all together. World traveler. Always. So he pushed himself to be like him. And every time he fell short, he went further into his own wounds, because he was nowhere near what the outside kept showing him."], ["p", 0, "That's all that gets said about it here. The rest is his. His scars, his story, his version — and it's his to tell, not anyone else's. The space stays open.", "That's all that gets said about it here. The rest is his. His scars, his story, his version,  and it's his to tell, not anyone else's. The space stays open."], ["p", 0, "I see you, brother. I see you."], ["p", 0, "And know that he sees him. Thinks about him even when he goes quiet. He isn't the easiest friend to have. Can go without calling, without the checkups. Can hide in his own shelter, his own world. It was never anything intentional."], ["p", 0, "I see. I see."], ["h", 2, "TAPIOCA"], ["p", 0, "His to tell."], ["h", 2, "THE CROSS"], ["p", 0, "The due date."], ["p", 0, "He carried the due date the way other men carry a wallet."], ["p", 0, "The due date came around on the calendar. He sat down."], ["p", 0, "The shop smelled like soap and burnt paper towel, the hum of the machine already up and idling before he'd even taken his shirt off. A hornet in a jar, waiting."], ["p", 0, "\"Big piece. You sure you want it there, over the scar like that?\""], ["p", 0, "\"That's the point.\""], ["p", 0, "The artist didn't ask a second time. Some men in that chair are running from something. This one was clearly walking straight into it, and you don't slow a man like that down with more questions than he came in with."], ["p", 0, "The Celtic Cross went on his back."], ["p", 0, "A grave marker. For a child who never breathed. Pressed directly over the scar that had opened the whole book — the line drawn down the spine in the middle of six screaming lanes on Prom Night — sealed under ink and faith and grief so total it required permanent skin to hold it.", "A grave marker. For a child who never breathed. Pressed directly over the scar that had opened the whole book,  the line drawn down the spine in the middle of six screaming lanes on Prom Night,  sealed under ink and faith and grief so total it required permanent skin to hold it."], ["p", 0, "Two wounds. One mark. Stacked."], ["p", 0, "The cross covers the wound. The wound is still there. The cross knows."], ["p", 0, "The needle went in. Black ink, line by line, into skin that had already learned to remember. The cross took shape over the spine. Below it — invisible now, but there always — the Prom Night line. The child's due date above it. The blade's first mark below. Buried under the only thing he had left to put over it.", "The needle went in. Black ink, line by line, into skin that had already learned to remember. The cross took shape over the spine. Below it,  invisible now, but there always,  the Prom Night line. The child's due date above it. The blade's first mark below. Buried under the only thing he had left to put over it."], ["p", 0, "Not redemption. Not yet. Not in this book."], ["p", 0, "This is only the headstone. Worn on a living man's back."]]
