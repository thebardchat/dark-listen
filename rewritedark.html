try. The back rooms of the Gentlemen's Club. A rough, desperate version of himself running through the gravel lots — a man he will not defend and will not deny. The fight that ended it was about The First Son. Whether he was allowed to visit. Whether a man could have both his children in the same state at the same time. She had an answer for that."], ["p", 0, "\"Go be with your illiterate redneck faggot son.\""], ["p", 0, "He slapped her."], ["p", 0, "Immediate regret, no hesitation — both things true at the same second, in the same body, with no distance between them. He ran out the door and into a bar and drowned in whatever was closest to the rail. When he came back to the apartment she was already three steps ahead of him. Then she orchestrated the evacuation. The moving van was not a reaction. The moving van was already arranged. Surgical. He never saw the strike coming."], ["p", 0, "He did not know that yet. He helped load it. He carried her furniture out of the apartment and into the van and drove to her family's place and unloaded it all — box by box, room by room — because that is what you do when you are trying. When you are sorry. When you still believe trying is the same as a chance. Then he went to his truck to unload it. She stopped him. She pointed to the truck. He looked at it for the first time as though someone else had packed it."], ["p", 0, "She had sorted it while he carried her boxes. His things — what little she'd designated as his — already in the truck. Her things — everything — already in the van. He had moved her into her family's house himself, box by box, not understanding he was building the walls that would lock him out. Every box a brick. His own two hands, mortaring."], ["p", 0, "It's temporary."], ["p", 0, "It was not temporary. Locks changed, rooms emptied, the child removed while he was out of the house. He returned to a structure scrubbed of his existence. The bed. The clothes. The small things that proved a person had been living there. Gone or moved outside the door in a black garbage bag, depending on its value."], ["p", 0, "No money. No friends. No floor. Weeks in that truck. He slept sitting up, because lying down meant admitting this was where he lived. Breath on the glass. Fogged, then clear, then fogged again, the only clock he had. The lot lights going all night like they were waiting for someone who had somewhere else to be. The city moved around the cab like he wasn't in it — because to the city, he wasn't. A man can disappear in a parking lot in a way he cannot disappear in a house. Houses have addresses. Trucks have hours. Homeless on the Eastside."], ["p", 0, "He got behind a bar. Pulling taps. Slinging rail liquor at three hundred and fifty dollars a night. He worked the rush, ran the room, traded drinks for survival in a city where nobody knew his real name. He got a place on the Loop and built something out of nothing in a city that owed him nothing back."], ["p", 0, "Strip bars serve ribeye at 7am if you stay up long enough."], ["p", 0, "Then she told him she was carrying his child again. He was so excited. He pleaded. He laid every argument down. He put every card on the table he had ever held and said every true thing available to him. The clinic doors closed anyway. He stood outside them. That is the whole geography of it. A man on the wrong side of a door, with every true thing he had ever held already said, and none of it having been enough. The building did not care. Buildings don't. They take what they take and they keep their hours. Glass doors, locked, his own face floating in them."], ["p", 0, "The day I died more."], ["p", 0, "With every breath I took imagining the breaths being stolen from my unborn child with nothing I could do to stop it."], ["p", 0, "She packed the remainder of her life."], ["p", 0, "She disappeared again. Moved."], ["p", 0, "He walked out into the parking lot. Car dead. Pockets empty. The killer running through his bloodstream. Every road on the map ending in a wall. He stood in the dark, and the dark just looked back at him."], ["h", 2, "TUCK TAIL AND RUN"], ["p", 0, "South."], ["p", 0, "He turned the radiator south and drove back toward Alabama. Not as a conqueror. Not with a single wound stitched closed, a single ledger balanced, a single thing in the car that amounted to a plan. He drove south because south was the only direction left, and the only thing waiting there was the starting point — the asphalt, the town that had cut him open and kept going. Headlights pulling the road toward him, mile after black mile."], ["p", 0, "Tuck tail and run."], ["p", 0, "She had drifted back to Rocket Valley too. He went straight back into the fire to find his boy. She raised the walls and guarded the perimeter."], ["p", 0, "The hallway didn't end when he crossed the state line. It just changed its wallpaper."], ["p", 0, "He kept walking."], ["h", 2, "I SEE YOU, BROTHER"], ["p", 0, "This is not a wound he gets to tell. It belongs to somebody else, and the book will not take it from him. But there is one thing that needs saying straight at him, out loud, no third person standing between them this time. More than the scar. More than what could be seen on that highway — it's the wound that was left behind. The wound he carries. For the longest time he didn't know it was there. Tapioca was always somewhere else — the jungle, adventures, everywhere a man could imagine, happy and strong, like he had it all together. World traveler. Always. So he pushed himself to be like him. And every time he fell short, he went further into his own wounds, because he was nowhere near what the outside kept showing him."], ["p", 0, "That's all that gets said about it here. The rest is his. His scars, his story, his version — and it's his to tell, not anyone else's. The space stays open."], ["p", 0, "I see you, brother. I see you."], ["p", 0, "And know that he sees him. Thinks about him even when he goes quiet. He isn't the easiest friend to have. Can go without calling, without the checkups. Can hide in his own shelter, his own world. It was never anything intentional."], ["p", 0, "I see. I see."], ["h", 2, "TAPIOCA"], ["p", 0, "His to tell."], ["h", 2, "THE CROSS"], ["p", 0, "The due date."], ["p", 0, "He carried the due date the way other men carry a wallet. The due date came around on the calendar. He sat down. The shop smelled like soap and burnt paper towel, the hum of the machine already up and idling before he'd even taken his shirt off. A hornet in a jar, waiting."], ["p", 0, "\"Big piece. You sure you want it there, over the scar like that?\""], ["p", 0, "\"That's the point.\""], ["p", 0, "The artist didn't ask a second time. Some men in that chair are running from something. This one was clearly walking straight into it, and you don't slow a man like that down with more questions than he came in with. The Celtic Cross went on his back. A grave marker. For a child who never breathed. Pressed directly over the scar that had opened the whole book — the line drawn down the spine in the middle of six screaming lanes on Prom Night — sealed under ink and faith and grief so total it required permanent skin to hold it. Two wounds. One mark. Stacked."], ["p", 0, "The cross covers the wound. The wound is still there. The cross knows."], ["p", 0, "The needle went in. Black ink, line by line, into skin that had already learned to remember. Each pass of the needle found the old line and worked over it, not erasing, covering. The cross took shape over the spine. Below it — invisible now, but there always — the Prom Night line. The child's due date above it. The blade's first mark below. Buried under the only thing he had left to put over it. He did not speak while it was done. The machine hummed. The ink went in. When it was finished the skin was raw and the mark was permanent. Not redemption. Not yet. Not in this book. This is only the headstone. Worn on a living man's back."], ["h", 2, "RISEN"], ["p", 0, "Under the ink, the line is still there. Under the day, the deep water. He comes up through both."], ["p", 0, "He breaks the surface out of that day. Not snapped back. Risen, the way you come up out of deep water once you've decided to. Water off his shoulders. Still on one knee. Still bleeding. The wound still with him."], ["p", 0, "I come up for the last time in the book. Not snapped back. Risen."], ["p", 0, "And laid over the man on his knee holding the shield, he can see the boy driving himself home on a ruined arm, muscle and bone at the wheel. The same set of the jaw. Years apart. One posture."], ["p", 0, "A boy took a blade that should have ended him and did not end. Drove himself home leaking. Walked into a room full of light with the wound still open. And voted to keep living."], ["p", 0, "He wasn't surviving by accident. He was being forged."], ["p", 0, "And then he sees the shield whole for the first time, and its face is made of his own scars. The five slashes and the sixth mark, the one that stays, arranged into the shield's heraldry: red lines on a black field, a coat of arms cut into a man. A crest nobody designed, earned stroke by stroke."], ["p", 0, "The knife that stays didn't cripple me. It credentialed me."], ["p", 0, "I could be the shield in cut five because of the knife in cut six. The boy made the man. The wound made the wall."], ["p", 0, "Quiet. His hand rests low on his back, at the place where it went in. Not reaching to pull anything out. Accepting it."], ["p", 0, "Some knives you don't get to take out. Some passengers you don't get to unbuckle."], ["p", 0, "You just find out, years later, at the worst hour, that the thing you thought was killing you the whole time is the exact thing that let you save your child."], ["p", 0, "The man on his knee, shield up, the small silhouette safe behind it. At the edge of things, the hand. And for the first time in the whole story, it withdraws. It retreats into the black. It goes the way a tide goes: not beaten, only leaving."], ["p", 0, "The hand withdraws. Not because it lost — a thing that patient never fully loses."], ["p", 0, "He watches it go to nothing."], ["p", 0, "Because it finally met the one thing it never accounts for and never can."], ["p", 0, "The dark has one more thing to say, small, receding, almost gone."], ["p", 0, "...a wound that made a man stronger than the taking of him."], ["p", 0, "The man kneels, shield up, the boy behind it. And the first real white swells in from the edges of the dark."], ["p", 0, "Tried to take my son. I lifted my shield. And the shield was made out of everything that ever tried to take me."], ["p", 0, "Read down the line of him, from the spine out, the six cuts of red spell not a man destroyed but a man built. The white takes everything."], ["p", 0, "Not a man being destroyed. A man being built."], ["p", 0, "The scar that stays, the shield that stays, the boy behind it. White, and held."], ["h", 2, "THE LAST WITNESS"], ["p", 0, "The screen throws its final held white across the old soldier's face one last time: the shield up, the boy behind it. He sees it. We see only what it does to him. This white is warm. This is grace. It settles over the old face the way light settles over a table once the dishes are cleared. The old man lit white, and still."], ["p", 0, "He watched every frame. Red then black then red. He never once looked away."], ["p", 0, "The screen goes dark. For the first time since it came on, the room is only black. The room lets out a breath it has held since the first cut. The old man in true, quiet dark. Nobody says anything. There is nothing left that needs saying. He does the only thing a first witness, a last witness, can do."], ["p", 0, "He believes it. He receives it. He lets it be true and doesn't flinch it smaller."], ["p", 0, "The little room is black, and the old man is small in the recliner that knows the exact shape of him. He sits a minute. Doesn't move."], ["p", 0, "And when it's over he sits a minute in the dark."], ["p", 0, "His hand rests on the armrest. This is the hand that, at the start of the night, tightened into the door handle of that bright day. At rest now. Easy, open, done gripping. Every knuckle that held on so long has been given leave to let go. He gets up. Slow. The whole weight of a life in the rise. He stands the way a house settles, one beam at a time."], ["p", 0, "Then he gets up slow. And crosses the little country of his room."], ["p", 0, "He reaches the window. Through it: the big house. The kitchen light. The boys' windows. Everyone still up, safe, winding down on their own screens. The big-house light is the one warm white in the dark: grace, home. Small squares of warm white hung in the dark, and every one of them somebody he would die for."], ["p", 0, "He looks out at the big house. Where they're all still up. Safe. Winding down."], ["p", 0, "His reflection lies faint in the glass, laid over the warm windows of home: the old soldier and the house he guards, one image in one pane. A man and his house in a single pane of glass, and neither one crowding the other. Behind him, the recliner, empty and dark. And he knows, the way old soldiers know."], ["p", 0, "The shield held. The boy came back different — but came back."], ["p", 0, "The old man stands at the window, small against the warm white house. Near it, not crowding it, the way he has stood his whole life. All the red is spent. What is left is black, and the one grace-white of home. The light does not waver. It has not wavered once."], ["p", 0, "The line goes on."], ["p", 0, "The white doesn't fade out. It stays, the way a porch light stays for whoever is still out. The Devil does not win."], ["p", 0, "It was never only about you."]];const S=speechSynthesis,K='dc-listen-v1';
const m=document.getElementById('txt'),chap=document.getElementById('chap'),vs=document.getElementById('voice'),rate=document.getElementById('rate'),play=document.getElementById('play'),st=document.getElementById('st');
let st0=JSON.parse(localStorage.getItem(K)||'{}'),i=st0.i||0,playing=false,voices=[],tok=0;
rate.value=st0.rate||1;document.getElementById('rv').textContent=(+rate.value).toFixed(1);
P.forEach((p,k)=>{const e=document.createElement(p[0]=='h'?(p[1]<=2?'h2':'h3'):'p');e.textContent=p[2];e.onclick=()=>go(k,true);m.appendChild(e);
 if(p[0]=='h'&&p[1]==2){const o=document.createElement('option');o.value=k;o.textContent=p[2];chap.appendChild(o)}});
const els=m.children;
function save(){localStorage.setItem(K,JSON.stringify({i,rate:+rate.value,voice:vs.value}))}
function mark(){for(const e of document.querySelectorAll('.on'))e.classList.remove('on');els[i].classList.add('on');els[i].scrollIntoView({block:'center',behavior:'smooth'});
 let c=null;for(const o of chap.options)if(+o.value<=i)c=o.value;if(c!==null)chap.value=c;st.textContent='Paragraph '+(i+1)+' of '+P.length;save()}
function chunks(t){if(t.length<=220)return[t];const s=t.match(/[^.!?…]+[.!?…]+["'”’*)]*\s*|.+$/g)||[t];const o=[];let b='';for(const x of s){if((b+x).length>220&&b){o.push(b);b=x}else b+=x}if(b)o.push(b);return o}
function speak(){const my=++tok;S.cancel();if(!playing)return;const parts=chunks(P[i][2]);let n=0;
 const say=()=>{if(my!==tok||!playing)return;if(n>=parts.length){if(i<P.length-1){i++;mark();speak()}else{setPlay(false)}return}
  const u=new SpeechSynthesisUtterance(parts[n++]);u.rate=+rate.value;const v=voices.find(v=>v.voiceURI==vs.value);if(v){u.voice=v;u.lang=v.lang}
  u.onend=()=>setTimeout(say,P[i][0]=='h'?500:150);u.onerror=e=>{if(e.error!='interrupted'&&e.error!='canceled')setTimeout(say,200)};S.speak(u)};
 setTimeout(say,60)}
function setPlay(v){playing=v;play.textContent=v?'❚❚ Pause':'▶ Play';if(v){mark();speak()}else{tok++;S.cancel()}}
function go(k,keep){i=Math.max(0,Math.min(P.length-1,k));mark();if(playing)speak()}
play.onclick=()=>setPlay(!playing);
document.getElementById('back').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);
chap.onchange=()=>go(+chap.value);
rate.oninput=()=>{document.getElementById('rv').textContent=(+rate.value).toFixed(1);save()};rate.onchange=()=>{if(playing)speak()};
vs.onchange=()=>{save();if(playing)speak()};
function lv(){voices=S.getVoices();if(!voices.length)return;vs.innerHTML='';const en=voices.filter(v=>/^en/i.test(v.lang));(en.length?en:voices).forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';vs.appendChild(o)});
 if(st0.voice&&[...vs.options].some(o=>o.value==st0.voice))vs.value=st0.voice}
lv();S.onvoiceschanged=lv;setTimeout(lv,500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&playing&&!S.speaking)speak()});
mark();
</script></body></html>
